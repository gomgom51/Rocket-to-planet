name: Version navigateur (GitHub Pages)

# Puts the game (the web/ folder) online, for free, at
#   https://<owner>.github.io/<repo>/
# GitHub Pages must be turned on once in the repository settings:
#   Settings → Pages → Build and deployment → Source: « GitHub Actions ».
# Until then this workflow does nothing (it does not fail).

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # GitHub only lets the default branch publish the site.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Is GitHub Pages turned on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages n'est pas activé avec la source « GitHub Actions » (Settings → Pages) : rien n'est publié."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
