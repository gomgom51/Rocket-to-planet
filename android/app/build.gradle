plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.fusee.planetes'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.fusee.planetes'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // The APK is signed with a fixed debug key kept in the repository, so a
    // new version can be installed over the previous one (settings and
    // visited planets are kept). It is NOT meant for the Play Store.
    signingConfigs {
        family {
            storeFile file('family-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.family
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.family
        }
    }

    // The game itself lives in ../../web and is packaged as app assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
